}

function drawOneFish(f, t) {
    const ctx = fishCtx;
    const dir = f.vx > 0 ? 1 : -1;
    const wobbleY = Math.sin(f.wobble) * 2.5;
    ctx.save();
    ctx.translate(f.x, f.y + wobbleY);
    ctx.rotate(f.vy * 0.05 * dir);
    ctx.scale(dir * f.z, f.z);
    ctx.globalAlpha = 0.62 + f.z * 0.38;
    switch (f.type) {
        case 'shark': drawShark(ctx, f, t); break;
        case 'koi': drawKoi(ctx, f, t); break;
        case 'angel': drawAngel(ctx, f, t); break;
        case 'clown': drawClown(ctx, f, t); break;
        case 'puffer': drawPuffer(ctx, f, t); break;
        default: drawTetra(ctx, f, t); break;
    }
    ctx.restore();
}
// 名牌: 名称 + 股数, 没有底块; 画在最上层, 两个名牌挨得太近时把后一个往上错开
function drawFishLabels() {
    const ctx = fishCtx, placed = [];

    ctx.shadowColor = 'rgba(0,20,40,0.9)'; ctx.shadowBlur = 6;

}

// ---- Environment ----
function drawBubbles(t) {
    const ctx = fishCtx;
    const rect = fishCanvas.getBoundingClientRect();

        const bx = b.x + Math.sin(b.wobble) * 10;

        ctx.arc(bx, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${b.alpha * 0.5})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(255,255,255,${b.alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
        // Highlight
        ctx.fillStyle = `rgba(255,255,255,${b.alpha * 0.8})`;

    });
}

// ---- 场景: 深蓝海水 ----
function tankRng(seed) { let v = seed; return () => { v = (v * 16807) % 2147483647; return (v - 1) / 2147483646; }; }
function tankRock(ctx, x, y, w, h, c1, c2, seed) {
    const r = tankRng(seed), n = 7;
    const g = ctx.createLinearGradient(x - w / 2, y - h, x + w / 2, y);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y + 6);
    for (let i = 0; i <= n; i++) { const k = i / n; ctx.lineTo(x - w / 2 + w * k, y - h * Math.sin(Math.PI * k) * (0.7 + r() * 0.5)); }
    ctx.lineTo(x + w / 2, y + 6);
    ctx.closePath();
    ctx.fill();
}
function tankKelp(ctx, x, y, h, w, t, ph) {
    const n = 10, L = [], R = [];
    for (let i = 0; i <= n; i++) { const k = i / n, ox = Math.sin(t * 0.0011 + ph + k * 2.6) * 22 * k, ww = w * (1 - k * 0.85); L.push([x + ox - ww / 2, y - h * k]); R.push([x + ox + ww / 2, y - h * k]); }
    const g = ctx.createLinearGradient(0, y, 0, y - h);
    g.addColorStop(0, '#0f5a4e'); g.addColorStop(1, '#1f8a6e');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(L[0][0], L[0][1]);
    L.forEach(p => ctx.lineTo(p[0], p[1]));
    R.reverse().forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.closePath();
    ctx.fill();
}
function drawTankBackground(t) {
    const ctx = fishCtx;
    const rect = fishCanvas.getBoundingClientRect();
    const W = rect.width, H = rect.height, u = H / 540;
    // 海水: 由亮蓝到深蓝
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a6f9c'); grad.addColorStop(0.35, '#0e4f78'); grad.addColorStop(0.75, '#093453'); grad.addColorStop(1, '#06223a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // 远处一层礁石
    tankRock(ctx, W * 0.23, H - 70 * u, W * 0.54, 120 * u, '#12456a', '#0d3554', 3);
    tankRock(ctx, W * 0.79, H - 76 * u, W * 0.48, 140 * u, '#12456a', '#0d3554', 5);
    // 阳光
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 6; i++) {
        const x = W * (0.06 + i * 0.15), sw = Math.sin(t * 0.0003 + i * 1.3) * 26, al = 0.11 * (0.6 + 0.4 * Math.sin(t * 0.0007 + i));
        const g = ctx.createLinearGradient(0, 0, 0, H * 0.92);
        g.addColorStop(0, `rgba(170,225,255,${al})`); g.addColorStop(1, 'rgba(170,225,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(x + sw, 0); ctx.lineTo(x + W * 0.06 + sw, 0); ctx.lineTo(x + W * 0.2 + sw * 2.4, H); ctx.lineTo(x - W * 0.07 + sw * 2.4, H);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
    // 近处一层礁石 + 两侧海带
    tankRock(ctx, W * 0.09, H - 52 * u, W * 0.31, 110 * u, '#0e3a59', '#0a2a44', 8);
    tankRock(ctx, W * 0.58, H - 50 * u, W * 0.4, 84 * u, '#0e3a59', '#0a2a44', 11);
    tankRock(ctx, W * 0.94, H - 50 * u, W * 0.27, 120 * u, '#0e3a59', '#0a2a44', 13);
    [[0.04, 230, 18, 0], [0.077, 300, 22, 1.3], [0.117, 190, 16, 2.2], [0.906, 260, 20, 0.6], [0.946, 330, 24, 1.9], [0.979, 210, 16, 3]]
        .forEach(([fx, h, w, ph]) => tankKelp(ctx, W * fx, H - 40 * u, h * u, w * u, t, ph));
    // 沙地 + 流动的水波光纹
    const y = H - 48 * u;
    const sg = ctx.createLinearGradient(0, y - 10, 0, H);
    sg.addColorStop(0, '#b9a983'); sg.addColorStop(1, '#6f6a58');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(0, H); ctx.lineTo(0, y + 8);
    ctx.bezierCurveTo(W * 0.25, y - 14, W * 0.45, y + 16, W * 0.62, y + 2);
    ctx.bezierCurveTo(W * 0.8, y - 12, W * 0.92, y + 10, W, y - 2);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(200,240,255,0.16)'; ctx.lineWidth = 1.4;
    for (let r = 0; r < 5; r++) {
        ctx.beginPath();
        for (let x = -20; x <= W + 20; x += 14) {
            const yy = H - 40 * u + r * 13 * u + Math.sin(x * 0.035 + t * 0.0011 + r * 1.7) * 5 + Math.sin(x * 0.012 - t * 0.0007 + r) * 4;
            if (x === -20) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
    }
    ctx.restore();
    // 浮尘
    tankDust.forEach(d => {
        d.y -= d.v; d.x += Math.sin(d.o + d.y * 0.02) * 0.12;
        if (d.y < -4) { d.y = H + 4; d.x = Math.random() * W; }
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,235,255,${d.a})`; ctx.fill();
    });
}

function animateFish(t) {
    if (!fishDataReady) return;
    const rect = fishCanvas.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    if (W === 0 || H === 0) return;
    // 帧时间归一: 1 = 60fps 一帧; 上限 2 防止后台/降帧回来时跳格
    const dt = _fishLastT == null ? 1 : Math.min(2, Math.max(0.25, (t - _fishLastT) / (1000 / 60)));
    _fishLastT = t;

    drawTankBackground(t);

    // Update fish
    fishList.forEach(f => {
        const tailSpeed = f.type === 'shark' ? 0.06 : f.type === 'puffer' ? 0.04 : 0.08;
        f.tailPhase += (tailSpeed + f.speed * 0.03) * dt;
        f.wobble += (f.type === 'puffer' ? 0.02 : 0.03) * dt;
        f.mouthPhase += 0.05 * dt;
        if (f.type === 'puffer') f.puffPhase += 0.008 * dt;
        f.turnTimer -= dt;
        if (f.turnTimer <= 0) {
            f.turnTimer = 80 + Math.random() * 250;
            f.vy = (Math.random() - 0.5) * f.speed * 0.5;
            if (Math.random() < 0.18) f.vx = -f.vx;
        }
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        // Smooth boundary avoidance
        const margin = f.size * 1.2;
        if (f.x < margin) { f.vx += 0.05 * dt; }
        if (f.x > W - margin) { f.vx -= 0.05 * dt; }
        if (f.y < margin + 70) { f.vy += 0.03 * dt; }   // 上面留出名牌和左上角说明的位置
        if (f.y > H - margin - 30) { f.vy -= 0.03 * dt; }
        // Clamp speed
        const maxV = f.speed * 1.5;
        f.vx = Math.max(-maxV, Math.min(maxV, f.vx));
        f.vy = Math.max(-maxV * 0.5, Math.min(maxV * 0.5, f.vy));
    });

    // 先画远的, 再画近的; 然后气泡、暗角, 名牌在最上层
    [...fishList].sort((a, b) => a.z - b.z).forEach(f => drawOneFish(f, t));
    drawBubbles(t);
    const vg = fishCtx.createRadialGradient(W / 2, H * 0.45, H * 0.35, W / 2, H / 2, W * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.38)');
    fishCtx.fillStyle = vg;
    fishCtx.fillRect(0, 0, W, H);
    drawFishLabels();
}

// Canvas 动画按实际可见性启停：折叠、离开视口或切到后台均不渲染。
const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
let fishAnimationRaf = null;
let fishAnimationTimer = null;
let fishCanvasInView = false;

function fishAnimationWanted() {
    return fishDataReady
        && document.visibilityState === 'visible'
        && (tankFullOpen || tankBoxOpen())
        && fishCanvasInView;
}

function cancelFishAnimation() {
    _fishLastT = null;
    if (fishAnimationRaf !== null) cancelAnimationFrame(fishAnimationRaf);
    if (fishAnimationTimer !== null) clearTimeout(fishAnimationTimer);
    fishAnimationRaf = null;
    fishAnimationTimer = null;
}

function scheduleFishAnimation() {
    if (!fishAnimationWanted() || fishAnimationRaf !== null || fishAnimationTimer !== null) return;
    const requestFrame = () => {
        fishAnimationTimer = null;
        fishAnimationRaf = requestAnimationFrame(runFishAnimationFrame);
    };
    if (reducedMotionQuery.matches) fishAnimationTimer = setTimeout(requestFrame, 100); // 减少动效时约 10fps
    else requestFrame();
}

function runFishAnimationFrame(t) {
    fishAnimationRaf = null;
    if (!fishAnimationWanted()) return;
    animateFish(t);
    scheduleFishAnimation();
}

function syncVisualAnimations() {
    cancelFishAnimation();
    scheduleFishAnimation();
    const pageVisible = document.visibilityState === 'visible';
    if (typeof window.syncParticleAnimation === 'function') window.syncParticleAnimation();
}

const fishVisibilityObserver = new IntersectionObserver(entries => {
    fishCanvasInView = entries.some(entry => entry.isIntersecting && entry.intersectionRatio > 0);
    syncVisualAnimations();
}, { threshold: 0.01 });
fishVisibilityObserver.observe(fishCanvas);

document.addEventListener('visibilitychange', syncVisualAnimations);
if (typeof reducedMotionQuery.addEventListener === 'function') reducedMotionQuery.addEventListener('change', syncVisualAnimations);
else reducedMotionQuery.addListener(syncVisualAnimations);

initFishTank();
window.addEventListener('resize', () => { initFishTank(); });

refreshPortfolioData();

                const y = (e.clientY - rect.top) / rect.height - 0.5;
                card.style.setProperty('--tx', (x * 3).toFixed(2) + 'deg');
                card.style.setProperty('--ty', (-y * 3).toFixed(2) + 'deg');
            });
            card.addEventListener('mouseleave', () => {
                card.style.setProperty('--tx', '0deg');
                card.style.setProperty('--ty', '0deg');
            });
        });
    }
    attachTilt();
    const tiltObserver = new MutationObserver(() => attachTilt());
    tiltObserver.observe(document.body, { childList: true, subtree: true });

    // --- Tier 4 #24 + #25: 数字翻牌 + 涟漪 (触发在 totalAssets 文本变化时) ---
    function pulseRipple(originEl) {
        const burst = document.createElement('div');
        burst.className = 'ripple-burst';
        const rect = originEl.getBoundingClientRect();
        burst.style.position = 'fixed';
        burst.style.left = (rect.left + rect.width / 2) + 'px';
        burst.style.top = (rect.top + rect.height / 2) + 'px';
        document.body.appendChild(burst);
        setTimeout(() => burst.remove(), 800);
    }
    function flipNumber(el) {
        el.classList.remove('num-flip');
        void el.offsetWidth;
        el.classList.add('num-flip');
    }
    function watchValueChange(elId, withRipple) {
        const el = document.getElementById(elId);
        if (!el) return;
        let last = el.textContent;
        const mo = new MutationObserver(() => {
            const now = el.textContent;
            if (now !== last && now !== '--' && last !== '--' && now.indexOf('0.00') === -1) {
                flipNumber(el);
                if (withRipple) pulseRipple(el);
            }
            last = now;
        });
        mo.observe(el, { childList: true, characterData: true, subtree: true });
    }
    setTimeout(() => {
        //  翻牌也停: 实测每~7秒一次数据补丁就翻一次牌(120秒内28次class切换), 是"还在闪"的最后来源;
        // 页面性格定为安静——数字更新不配动画。watchValueChange 保留定义备用, 不再挂载。
    }, 500);

})();
</script>
</body>
