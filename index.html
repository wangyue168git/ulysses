    <!-- 本地化静态资源(原 cdn.tailwindcss.com 运行时 + jsdelivr chart.js): 摆脱 CDN 抖动,与 m.html 共用同一份 -->

    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 1);
        }
        .flash-up { animation: flashUp .6s; }
        .flash-down { animation: flashDown .6s; }
        @keyframes flashUp { from { background: rgba(239,68,68,.12); } to { background: transparent; } }
        @keyframes flashDown { from { background: rgba(16,185,129,.12); } to { background: transparent; } }
        .conn-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .conn-dot.online { background: #10b981; animation: pulse 2s infinite; }
        .conn-dot.offline { background: #ef4444; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* ===== 暗色主题 v2 : 与 m.html 同逻辑同色板——CSS变量 + 手机式宽映射 ===== */
        html.dark {
            color-scheme: dark;
            --bg: #0c1118; --card: #161d27; --text: #e6edf3; --dim: #8b98a8;
            --border: #232c38; --border2: #1c242f; --pill-bg: #232c38; --tab-active: #2a3645;
        }
        html.dark body { background: var(--bg); }
        html.dark .glass-card { background: var(--card); border-color: var(--border); }
        html.dark .bg-white, html.dark .bg-white\/50, html.dark .bg-white\/60, html.dark .bg-white\/70, html.dark .bg-white\/80 { background-color: var(--card) !important; }
        html.dark .bg-slate-50, html.dark .bg-slate-50\/50, html.dark .bg-slate-50\/80 { background-color: var(--border2) !important; }
        html.dark .bg-red-50 { background-color: rgba(239,68,68,0.12) !important; }
        html.dark .bg-red-100 { background-color: rgba(239,68,68,0.2) !important; }
        html.dark .bg-amber-100 { background-color: rgba(245,158,11,0.2) !important; }
        html.dark .bg-slate-100 { background-color: var(--pill-bg) !important; }
        html.dark .bg-slate-900 { background-color: var(--tab-active) !important; } /* 激活态药丸=手机端tab-active同款 */
        html.dark .bg-indigo-50 { background-color: rgba(99,102,241,0.14) !important; }
        html.dark .bg-emerald-50 { background-color: rgba(16,185,129,0.12) !important; }
        html.dark .bg-amber-50 { background-color: rgba(245,158,11,0.12) !important; }
        /* 文字层级收敛两档(手机端策略): 900-600→text, 500-200→dim */
        html.dark .text-slate-900, html.dark .text-slate-800, html.dark .text-slate-700, html.dark .text-slate-600 { color: var(--text) !important; }
        html.dark .text-slate-500, html.dark .text-slate-400, html.dark .text-slate-300, html.dark .text-slate-200 { color: var(--dim) !important; }
        html.dark .text-indigo-600, html.dark .text-indigo-500 { color: #a5b4fc !important; }
        html.dark .text-red-500, html.dark .text-red-600 { color: #f87171 !important; }
        html.dark .text-emerald-600, html.dark .text-emerald-500 { color: #34d399 !important; }
        html.dark .text-amber-600 { color: #fbbf24 !important; }
        html.dark .text-amber-800 { color: #fcd34d !important; }
        html.dark .text-emerald-800 { color: #6ee7b7 !important; }
        /* 裸 border-*(无色类)吃tailwind默认浅灰,暗底统一压暗 */
        html.dark .border, html.dark .border-b, html.dark .border-t, html.dark .border-l, html.dark .border-r { border-color: var(--border2); }
        html.dark .border-slate-100, html.dark .border-slate-100\/50, html.dark .border-white\/30, html.dark .border-white\/60, html.dark .border-white\/80 { border-color: var(--border2) !important; }
        html.dark .ring-white\/50 { --tw-ring-color: rgba(255,255,255,0.06); } /* 个股卡图标光环压暗 */
        html.dark .border-slate-200 { border-color: var(--border) !important; }
        html.dark .border-amber-200 { border-color: rgba(245,158,11,0.3) !important; }
        html.dark .border-emerald-200 { border-color: rgba(16,185,129,0.3) !important; }
        html.dark input, html.dark select, html.dark textarea { background-color: var(--border2); color: var(--text); border-color: var(--border); }
        html.dark .bg-black\/40 { background-color: rgba(0,0,0,0.65) !important; }
        html.dark .hover\:bg-white\/60:hover { background-color: var(--pill-bg) !important; }
        html.dark .hover\:bg-slate-50:hover, html.dark .hover\:bg-indigo-50:hover { background-color: var(--border2) !important; }
        html.dark .hover\:text-slate-900:hover { color: var(--text) !important; }
        /* 沉浸场景豁免: 冷静模式自带永久深色,不参与收敛 */

        /* ===== W1 电脑端整体 ===== */
        :root { --w-text:#111827; --w-dim:#8e8e93; --w-card:rgba(255,255,255,.85); --w-line:#e0e2e7; --w-menu:#ffffff; }
        html.dark { --w-text:#f4f4f5; --w-dim:#9ca3af; --w-card:#161b26; --w-line:#232a38; --w-menu:#1b2130; }
        .w1-kai { font-family:"Kaiti SC","STKaiti","KaiTi",serif; }
        #w1Top { display:flex; align-items:center; justify-content:space-between; height:44px; margin-bottom:8px; color:var(--w-dim); }
        #w1Top h1 { font-size:20px; font-weight:700; letter-spacing:5px; color:var(--w-text); }
        .w1-top-r { display:flex; align-items:center; gap:16px; }
        .w1-mono { font:12px ui-monospace,Menlo,monospace; letter-spacing:.5px; display:inline-flex; align-items:center; gap:5px; margin-right:6px; }
        .w1-ico { color:var(--w-dim); padding:6px; border-radius:8px; display:inline-flex; background:none; border:0; cursor:pointer; }
        .w1-ico:hover { color:var(--w-text); }
        .w1-menu { position:absolute; right:0; top:38px; min-width:200px; z-index:60; background:var(--w-menu); color:var(--w-text); border-radius:14px; padding:6px 0; font-size:14px; box-shadow:0 0 0 1px rgba(148,163,184,.25),0 12px 30px rgba(0,0,0,.28); }
        .w1-menu div { display:flex; justify-content:space-between; align-items:center; gap:18px; padding:10px 18px; cursor:pointer; }
        .w1-menu div:hover { background:rgba(148,163,184,.12); }
        .w1-menu div span { color:var(--w-dim); }
        .w1-menu hr { border:0; border-top:1px solid var(--w-line); margin:5px 0; }
        #w1 { display:flex; min-height:calc(100vh - 120px); color:var(--w-text); }
        #w1Left { width:430px; flex:none; border-right:1px solid var(--w-line); padding:34px 20px 30px; font-family:"Kaiti SC","STKaiti","KaiTi",serif; }
        #w1Right { flex:1; min-width:0; display:flex; gap:36px; padding:10px 0 30px 40px; }
        #w1Pie { width:220px; flex:none; padding-top:34px; display:flex; flex-direction:column; align-items:center; gap:26px; }
        #w1Pie #portfolioLegend { display:flex; flex-direction:column; gap:10px; }
        #w1Pie #portfolioLegend > span { font-size:14px; font-weight:600; color:var(--w-text); }
        #w1List { flex:1; min-width:0; max-width:560px; }
        .w1-own { text-align:center; }
        .w1-lab { font-size:14px; color:var(--w-dim); }
        .w1-n { font-size:62px; font-weight:600; line-height:1; }
        .w1-last { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:18px; font-size:15px; }
        .w1-last > span:last-child { opacity:.85; }
        .w1-seal { width:23px; height:23px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; font-size:13px; background:#b83a2c; color:#fff; flex:none; }
        .w1-creed { display:flex; flex-direction:row-reverse; justify-content:center; gap:26px; margin-top:56px; }
        .w1-cv { writing-mode:vertical-rl; white-space:nowrap; letter-spacing:7px; }
        .w1-cv.main { font-size:32px; font-weight:600; } .w1-cv.sub { font-size:20px; opacity:.75; }
        .w1-sec { font-size:12px; font-weight:700; color:var(--w-dim); margin:18px 4px 8px; } .w1-sec:first-child { margin-top:0; }
        .w1-card { background:var(--w-card); border-radius:18px; overflow:hidden; }
        .w1-row { display:flex; justify-content:space-between; align-items:center; padding:11px 18px; cursor:pointer; }
        .w1-row + .w1-row { border-top:1px solid var(--w-line); }
        .w1-row:hover { background:rgba(148,163,184,.08); }
        .w1-row .l { display:flex; align-items:center; min-width:0; }
        .w1-dot { width:9px; height:9px; border-radius:50%; flex:none; margin-right:12px; }
        .w1-nm { font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .w1-nm small { font-weight:500; color:var(--w-dim); font-size:12px; margin-left:6px; }
        .w1-sub { font-size:12px; color:var(--w-dim); margin-top:2px; }
        .w1-sh { font-family:"Songti SC","STSong","Noto Serif SC",serif; font-size:22px; white-space:nowrap; margin-left:12px; } .w1-sh small { font-size:12px; color:var(--w-dim); margin-left:4px; }
        .w1-warn { color:#d97706; } html.dark .w1-warn { color:#fbbf24; }
        .w1-tag { font-size:11px; font-weight:700; color:#0d9488; margin-left:6px; }
        .w1-dim { position:fixed; top:0; right:0; bottom:0; left:0; z-index:50; background:rgba(0,0,0,.35); }
        .w1-drawer { position:fixed; top:0; right:0; bottom:0; width:min(440px,100vw); z-index:51; background:var(--w-menu); color:var(--w-text); padding:26px 28px; box-shadow:-18px 0 50px rgba(0,0,0,.35); animation:w1Slide .22s ease-out; }
        @keyframes w1Slide { from { transform:translateX(40px); opacity:0; } to { transform:none; opacity:1; } }
        #totalAssets { pointer-events:auto !important; cursor:pointer; }   /* 模糊时也能点(切换币种) */
        .w1-amt { font-size:40px; font-weight:900; letter-spacing:-1px; font-variant-numeric:tabular-nums; }
        .w1-pl { margin-top:12px; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.7; }
        .w1-pl i { font-style:normal; color:var(--w-dim); font-weight:500; margin-left:6px; }
        .w1-up { color:#ef4444; } .w1-dn { color:#10b981; }
        .w1-fresh { font-size:12px; color:var(--w-dim); margin-top:8px; font-variant-numeric:tabular-nums; }
        .w1-rng { display:flex; justify-content:center; gap:6px; margin-top:16px; }
        .w1-rng span { font-size:12px; color:var(--w-dim); font-weight:700; padding:5px 12px; border-radius:999px; cursor:pointer; }
        .w1-rng span.on { background:rgba(45,212,191,.18); color:#14b8a6; }
        body:not(.mask-mode) .w1-eye-slash { display:none; }
        .w1-ico.holding { color:#14b8a6; }
        .w1-px { margin-top:26px; border-top:1px solid var(--w-line); padding-top:6px; font-size:13px; font-variant-numeric:tabular-nums; }
        .w1-px > div { display:flex; justify-content:space-between; padding:9px 0; } .w1-px > div > span:first-child { color:var(--w-dim); } .w1-px b { font-weight:700; }
        body.mask-mode .w1-px { display:none; }
        .w1-btn { padding:12px 16px; border-radius:14px; font-size:14px; font-weight:700; border:1px solid var(--w-line); background:transparent; color:var(--w-text); cursor:pointer; }
        .w1-btn.main { background:#14b8a6; border-color:#14b8a6; color:#fff; }
        .w1-flab { display:block; font-size:12px; color:var(--w-dim); margin:22px 0 6px; }
        .w1-inp { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--w-line); background:transparent; color:var(--w-text); font-size:16px; font-variant-numeric:tabular-nums; outline:none; }
        .w1-inp:focus { border-color:#14b8a6; }
        #mobileTabBar { display:none !important; }
        @media (max-width: 900px) { #w1 { flex-direction:column; } #w1Left { width:auto; border-right:0; border-bottom:1px solid var(--w-line); } #w1Right { flex-direction:column; align-items:center; padding-left:0; } #w1List { width:100%; } }
        body.mask-mode .mask-amount { filter: blur(8px); user-select: none; pointer-events: none; }

        /* ============ Vision Pro 风科幻层 (Tier 1 + Tier 4) ============ */

        /* Tier 4 #22: 极淡 grid 背景 */
        #webGridBg {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image:
                linear-gradient(rgba(99,102,241,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99,102,241,0.045) 1px, transparent 1px);
            background-size: 56px 56px;
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.85) 0%, transparent 80%);
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.85) 0%, transparent 80%);
        }

        /* Tier 4 #21: 极淡粒子 canvas */
        #webParticleCanvas {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            opacity: 0.55;
        }

        /* body 内容层抬高到粒子之上 */
        body > .max-w-7xl, body > [class*="max-w-"] { position: relative; z-index: 1; }

        /* Tier 1 #2: 关键数字 italic + tabular-nums */
        .glass-card h2,
        h2#totalAssets, h2#totalPnl,
        .stat-number {
            font-variant-numeric: tabular-nums;
            font-style: italic;
            letter-spacing: -0.025em;
        }

        /* Tier 1 #1: 全息渐变边框 (hover 时流动) */
        @keyframes holoFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .glass-card {
            position: relative;
            transition: transform .3s cubic-bezier(0.2, 0.8, 0.3, 1), box-shadow .35s ease, border-color .3s;
        }
        .glass-card::before {
            content: ''; position: absolute; inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(110deg,
                rgba(129,140,248,0) 0%,
                rgba(129,140,248,0.55) 30%,
                rgba(34,211,238,0.55) 50%,
                rgba(167,139,250,0.55) 70%,
                rgba(129,140,248,0) 100%);
            background-size: 200% 100%;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            opacity: 0; transition: opacity .4s;
            pointer-events: none;
        }
        .glass-card:hover::before {
            opacity: 1;
            animation: holoFlow 3.5s linear infinite;
        }

        /* Tier 1 #3: 卡片 3D 倾斜 (JS 设置 --tx --ty) */
        .glass-card {
            transform: perspective(900px) rotateX(var(--ty, 0deg)) rotateY(var(--tx, 0deg)) translateZ(0);
            transform-style: preserve-3d;
        }
        .glass-card:hover {
            box-shadow:
                0 14px 38px -10px rgba(99,102,241,0.25),
                0 6px 18px -6px rgba(0,0,0,0.08);
        }

        /* Tier 1 #4: glow 焦点环 */
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: none;
            box-shadow:
                0 0 0 2px rgba(129,140,248,0.5),
                0 0 16px rgba(129,140,248,0.45);
            border-color: rgba(129,140,248,0.55) !important;
            transition: box-shadow .2s, border-color .2s;
        }

        /* Tier 1 #6: 顶部状态 LED 呼吸动画 (已有 .conn-dot, 加强版给关键 status) */
        .sci-led {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: #10b981; box-shadow: 0 0 6px #10b981, 0 0 14px #10b98166;
            animation: ledBreath 2.4s ease-in-out infinite;
            vertical-align: middle; margin-right: 5px;
        }
        @keyframes ledBreath {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        /* Tier 1 #7: 切角变体 (cyber panel feel, opt-in via .clipped-corner) */
        .clipped-corner {
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
        }

        /* Tier 4 #23: 页面切换 fade-in */
        @keyframes fadeInSci {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .sci-fade-in { animation: fadeInSci .35s cubic-bezier(0.2, 0.8, 0.3, 1); }

        /* Tier 4 #24: 数字翻牌 (subtle scale + glow flash, 叠加在 flash-up/down 之上) */
        @keyframes numFlip {
            0% { transform: translateY(-4px); opacity: 0.3; filter: blur(2px); }
            100% { transform: translateY(0); opacity: 1; filter: blur(0); }
        }
        .num-flip {
            display: inline-block;
            animation: numFlip .4s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        /* Tier 4 #25: 刷新涟漪 */
        @keyframes ripple {
            0% { width: 0; height: 0; opacity: 0.55; border-width: 2px; }
            100% { width: 600px; height: 600px; opacity: 0; border-width: 0.5px; }
        }
        .ripple-burst {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(129,140,248,0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: ripple .8s ease-out forwards;
        }

        /* 总资产一行 + 概览收起(电脑端, 方案 B) */
        #ovBar { display: flex; align-items: center; gap: 14px; padding: 13px 20px; margin-top: -20px; margin-bottom: 2rem; }
        #ovBar #totalAssetsMini { font-family: "Songti SC","STSong","Noto Serif SC",serif; font-size: 18px; font-weight: 600; }
        #ovBar #ovToggle { margin-left: auto; cursor: pointer; background: none; border: 0; padding: 4px 0; }
        #ovBar #ovToggle:hover { color: #64748b; }
        #ovBar, #ovBar:hover { transform: none !important; box-shadow: 0 1px 2px rgba(15,23,42,.04) !important; }   /* 这一行要安静: 不参与卡片的悬停倾斜和流光 */
        #ovBar::before { display: none; }
        @media (min-width: 768px) { #overviewGrid.ov-collapsed { display: none; } #overviewGrid { margin-top: -1rem; } }
        @media (max-width: 767px) { #ovBar { display: none; } }

        /* ============ 移动端双页 Tab 布局 (<768px) ============ */
        #mobileTabBar { display: none; }
        @media (max-width: 767px) {
            /* 主容器改弹性列以支持 order 重排，底部留白避开 Tab 栏 */
            #mainWrap { display: flex; flex-direction: column; padding-bottom: 4.75rem; }
            #mainWrap > header { order: -1; }
            .m-page-1, .m-page-2 { order: var(--mo, 50); }

            /* 按当前 tab 隐藏另一页 */
            body[data-mtab="assets"]   .m-page-2 { display: none !important; }
            body[data-mtab="holdings"] .m-page-1 { display: none !important; }

            /* 概览：总资产 + 总盈亏 并排一排 + 缩字号 */
            #overviewGrid { grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 0.6rem !important; margin-bottom: 1.25rem !important; }
            #overviewGrid .glass-card { padding: 1rem !important; }
            #overviewGrid h2 { font-size: 1.35rem !important; }

            /* 持仓卡片：2 列 + 整体缩小 */
            #assetsGrid { grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 0.6rem !important; }
            #assetsGrid > div { padding: 1rem !important; }
            #assetsGrid > div .mb-8 { margin-bottom: 0.85rem !important; }
            #assetsGrid > div .space-y-6 > * + * { margin-top: 0.7rem !important; }
            #assetsGrid > div .pt-6 { padding-top: 0.7rem !important; }
            #assetsGrid .w-14 { width: 2.4rem !important; height: 2.4rem !important; }
            #assetsGrid .h-14 { height: 2.4rem !important; }
            #assetsGrid h3 { font-size: 0.85rem !important; }
            #assetsGrid .text-3xl { font-size: 1.2rem !important; }
            #assetsGrid .text-lg { font-size: 0.95rem !important; }

            /* 持仓明细整块折叠 (默认收起) */

            /* 底部 Tab 栏 */
            #mobileTabBar {
                display: flex;

<script>
let ws, portfolioData = null;
let authToken = (() => { try { return localStorage.getItem('authToken') || ''; } catch (e) { return ''; } })();
let _loginWait = null;
function ensureLogin() {
    if (_loginWait) return _loginWait.p;
    let resolve; const p = new Promise(r => { resolve = r; });
    _loginWait = { p, resolve };
    document.getElementById('loginErr').style.display = 'none';
    document.getElementById('loginBox').style.display = 'flex';
    setTimeout(() => document.getElementById('loginPwd').focus(), 50);
    return p;
}
async function submitLogin() {
    const password = document.getElementById('loginPwd').value;
    let ok = false;
    try {
        const r = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
        const d = r.ok ? await r.json() : null;
        if (d && d.token) { authToken = d.token; try { localStorage.setItem('authToken', authToken); } catch (e) {} ok = true; }
    } catch (e) {}
    if (!ok) { document.getElementById('loginErr').style.display = ''; document.getElementById('loginPwd').value = ''; return; }
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('loginPwd').value = '';
    const w = _loginWait; _loginWait = null; if (w) w.resolve();
}
async function authedFetch(url, opts = {}) {
    const headers = Object.assign({}, opts.headers || {}, authToken ? { 'X-Auth-Token': authToken } : {});
    const r = await fetch(url, Object.assign({}, opts, { headers }));
    if (r.status !== 401) return r;
    authToken = ''; try { localStorage.removeItem('authToken'); } catch (e) {}
    await ensureLogin();
    return authedFetch(url, opts);
}
let portfolioChart = null;
let chartRange = 'all';   // 历史一次取全量(按交易日收盘), 抽屉里的 1M/6M/1Y/ALL 在前端裁
let lastChartHash = '';
let maskMode = true;   // W1: 每次打开都从隐藏开始(与手机端一致), 金额面板里按住眼睛 2 秒才显示
let refreshRequestSeq = 0;


// ===== 主题切换 v2 : 与 m.html 完全同逻辑 — 三态 auto/light/dark, 循环顺序/提示与手机一致 =====
let themeMode = localStorage.getItem('themeMode') || 'auto';
const _sysDarkMq = window.matchMedia('(prefers-color-scheme: dark)');
function systemDark(){ return _sysDarkMq.matches; }
function resolvedTheme(){ return themeMode === 'auto' ? (systemDark() ? 'dark' : 'light') : themeMode; }
function isDarkNow(){ return resolvedTheme() === 'dark'; }
function applyThemeMode(){
    document.documentElement.classList.toggle('dark', isDarkNow());
}
// 手动切换循环(与手机一致): 跟随系统 → 浅色 → 深色 → 跟随系统
function cycleTheme(){
    themeMode = themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto';
    localStorage.setItem('themeMode', themeMode);
    applyThemeMode();
    themeHint(themeMode === 'auto' ? '🌗 跟随系统' : themeMode === 'light' ? '☀️ 浅色' : '🌙 深色');
}
let _themeHintT = null;
function themeHint(txt){
    let el = document.getElementById('themeHint');
    if (!el){
        el = document.createElement('div');
        el.id = 'themeHint';
        el.style.cssText = 'position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:9000;background:rgba(0,0,0,.78);color:#fff;font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none';
        document.body.appendChild(el);
    }
    el.textContent = txt;
    el.style.opacity = '1';
    clearTimeout(_themeHintT);
    _themeHintT = setTimeout(() => { el.style.opacity = '0'; }, 1200);
}
_sysDarkMq.addEventListener('change', () => { if (themeMode === 'auto') applyThemeMode(); });
document.addEventListener('DOMContentLoaded', applyThemeMode);

document.addEventListener('keydown', (e) => {
});
function applyMask() {
    document.body.classList.toggle('mask-mode', maskMode);
}
applyMask();


// ---- WebSocket ----
function connect() {
    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${wsProto}://${location.host}/?token=${encodeURIComponent(authToken || '')}`);
    ws.onopen = () => {
        document.getElementById('connDot').className = 'conn-dot online';
        document.getElementById('connLabel').textContent = 'Live';
    };
    ws.onclose = (ev) => {
        document.getElementById('connDot').className = 'conn-dot offline';
        document.getElementById('connLabel').textContent = 'Offline';
        if (ev && ev.code === 4401) { authToken = ''; try { localStorage.removeItem('authToken'); } catch (e) {} ensureLogin().then(connect); return; }   // 登录失效: 重新登录后再连
        setTimeout(connect, 3000);
    };
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'portfolio') applyPortfolioData(msg.data);
        else if (msg.type === 'portfolio_patch') applyPortfolioPatch(msg.data);
        else if (msg.type === 'history_append') appendHistoryPoint(msg.data);
    };
}

// ---- 防闪动: 同快照去重 + 结构指纹降级 ----
// 病根: 服务端每逢 analysisRevision 变化(K线循环, 交易时段约10分钟一轮)广播全量包,
// 前端对全量包无条件整块重建 DOM(35 处 innerHTML), 结构其实没变 → 周期性连闪。
let _structFp = null;
function setHtmlIfChanged(el, html) {
    // 同串跳写: 内容没变就不动 DOM, 浏览器不重排不闪。守卫数据密集、被高频重绘的小区块。
    if (!el || el.__lastHtml === html) return;
    el.__lastHtml = html;
    el.innerHTML = html;
}
function structuralFingerprint(data) {
    // 只指纹"必须整块重建 DOM 才能体现"的字段(账户/持仓结构与成本);
    // 价格类字段由 realtimeOnly 路径原位更新, 不参与指纹, 避免每包都判定为变化。
    try {
        return (data.accounts || []).map(acc =>
            `${acc.name}~${Math.round(acc.cash || 0)}~` + (acc.holdings || []).map(h =>
                `${h.market || ''}|${h.symbol}|${h.shares}|${h.costPrice || 0}|${h.name || ''}`).join(',')
        ).join(';');
    } catch (e) { return 'fp-err-' + Date.now(); }
}
function applyPortfolioData(data) {
    if (!data || !data.accounts) return;
    // 去重: WS 握手首推与 HTTP 拉取常是同一份 latestData, 只渲染一次
    if (portfolioData && data.timestamp && data.timestamp === portfolioData.timestamp) return;
    const currentHistory = portfolioData?.history;
    const history = Array.isArray(currentHistory) && currentHistory.length ? currentHistory : (data.history || []);
    const benchmarks = portfolioData?.benchmarks || data.benchmarks;
    const prevFp = _structFp;
    portfolioData = { ...data, history };
    if (benchmarks && !portfolioData.benchmarks) portfolioData.benchmarks = benchmarks;
    _structFp = structuralFingerprint(data);
    if (prevFp && prevFp === _structFp) {
        // 结构未变的全量包 → 降级: 数字原位更新, 数据密集的小区块单独跟进, 不重建持仓/鱼缸等大块 DOM
        render(portfolioData, { realtimeOnly: true });
        renderDiscipline(portfolioData);
    } else {
        render(portfolioData);
    }
    ensureHistoryLoaded(chartRange);
    syncHistoryGap(data.historyMeta);
}

function applyPortfolioPatch(patch) {
    if (!portfolioData || !patch) {
        refreshPortfolioData();
        return;
    }
    const accounts = (portfolioData.accounts || []).map((acc, ai) => {
        const nextAcc = patch.accounts?.[ai];
        if (!nextAcc) return acc;
        return {
            ...acc,
            ...(nextAcc.cash !== undefined ? { cash: nextAcc.cash } : {}),
            holdings: (acc.holdings || []).map((h, hi) => ({ ...h, ...(nextAcc.holdings?.[hi] || {}) })),
        };
    });
    const { accounts: _accounts, ...rest } = patch;
    portfolioData = { ...portfolioData, ...rest, accounts };
    render(portfolioData, { realtimeOnly: true });
}

function mergeHistorySeries(current, incoming) {
    const byTime = new Map();
    [...(Array.isArray(current) ? current : []), ...(Array.isArray(incoming) ? incoming : [])].forEach(snapshot => {
        const ts = new Date(snapshot?.t).getTime();
        if (Number.isFinite(ts)) byTime.set(ts, snapshot);
    });
    return [...byTime.entries()].sort((a, b) => a[0] - b[0]).map(([, snapshot]) => snapshot);
}

function mergeHistoryPoints(points, riskMetrics) {
    if (!portfolioData || !Array.isArray(points) || !points.length) return;
    const current = Array.isArray(portfolioData.history) ? portfolioData.history : [];
    const history = mergeHistorySeries(current, points);
    const historyChanged = history.length !== current.length;
    const riskChanged = riskMetrics && JSON.stringify(riskMetrics) !== JSON.stringify(portfolioData.riskMetrics || null);
    if (!historyChanged && !riskChanged) return;
    portfolioData = { ...portfolioData, history, riskMetrics: riskMetrics || portfolioData.riskMetrics };
    if (historyLoadedRange) historyRangeCache.set(historyLoadedRange, history);
    for (const [range, cached] of historyRangeCache) {
        if (range === historyLoadedRange) continue;
        const merged = mergeHistorySeries(cached, points);
        if (merged.length !== cached.length) historyRangeCache.set(range, merged);
    }
    if (historyChanged) w1DrawCurve();
}

function appendHistoryPoint(payload) {
    if (payload?.snapshot) mergeHistoryPoints([payload.snapshot], payload.riskMetrics);
}

async function refreshPortfolioData() {
    const requestSeq = ++refreshRequestSeq;
    try {
        const portfolioResp = await authedFetch(`/api/portfolio?_=${Date.now()}`, { cache: 'no-store' });
        if (portfolioResp.ok) {
            const portfolio = await portfolioResp.json();
            // 首次打开(portfolioData 为空)跳过快照帧: 没有旧价格可继承, 这一帧市值残缺,
            // 画出来马上被 /api/data 推翻, 平白多闪一次。快照帧只服务"页面已在、用户刚改了数据"的场景。
            if (requestSeq === refreshRequestSeq && portfolioData) {
                const quickData = buildQuickPortfolioSnapshot(portfolio, portfolioData);
                applyPortfolioData(quickData);
            }
        }
    } catch (e) {}

    fetchFullPortfolioData(requestSeq);
}

function holdingKey(h) {
    return `${h.market || ''}|${h.symbol || ''}|${h.name || ''}`;
}

function getFallbackLastTradeAt(holding) {
    const trades = Array.isArray(holding?.transactions) ? holding.transactions : [];
    return trades.length ? (trades[trades.length - 1].date || null) : null;
}

function buildQuickPortfolioSnapshot(portfolio, previousData) {
    const prevHoldings = new Map();
    (previousData?.accounts || []).forEach(acc => {
        (acc.holdings || []).forEach(h => prevHoldings.set(holdingKey(h), h));
    });

    const exchangeRate = portfolio?.exchangeRate || previousData?.exchangeRate || { USD_CNY: 6.88 };
    const rateInfo = previousData?.rateInfo
        ? { ...previousData.rateInfo, USD_CNY: previousData.rateInfo.USD_CNY || exchangeRate.USD_CNY || 6.88 }
        : { USD_CNY: exchangeRate.USD_CNY || 6.88, USD_HKD: 7.82, lastUpdate: null };

    return {
        ...previousData,
        exchangeRate,
        rateInfo,
        accounts: (portfolio?.accounts || []).map(acc => ({
            ...acc,
            holdings: (acc.holdings || []).map(rawHolding => {
                const prevHolding = prevHoldings.get(holdingKey(rawHolding)) || {};
                const shares = Number(rawHolding.shares) || 0;
                const costPrice = Number(rawHolding.costPrice) || 0;
                const currentPrice = Number(prevHolding.currentPrice) > 0 ? prevHolding.currentPrice : costPrice;
                const marketValue = currentPrice * shares;
                const costValue = costPrice * shares;
                const pnl = marketValue - costValue;
                const pnlPercent = costValue > 0 ? (pnl / costValue) * 100 : 0;

                return {
                    ...prevHolding,
                    ...rawHolding,
                    shares,
                    costPrice,
                    currentPrice,
                    changePercent: prevHolding.changePercent || 0,
                    change: prevHolding.change || 0,
                    high: prevHolding.high || currentPrice || 0,
                    low: prevHolding.low || currentPrice || 0,
                    open: prevHolding.open || currentPrice || 0,
                    prevClose: prevHolding.prevClose || currentPrice || 0,
                    marketValue,
                    costValue,
                    pnl,
                    pnlPercent,
                    realizedPnl: prevHolding.realizedPnl || 0,
                    transactionCount: prevHolding.transactionCount || ((rawHolding.transactions || []).length || 0),
                    lastTradeAt: prevHolding.lastTradeAt || getFallbackLastTradeAt(rawHolding),
                    afterHours: prevHolding.afterHours || false,
                    preMarket: prevHolding.preMarket || false,
                    tech: prevHolding.tech || null,
                };
            }),
        })),
        timestamp: new Date().toISOString(),
    };
}

async function fetchFullPortfolioData(requestSeq) {
    try {
        const resp = await authedFetch(`/api/data?_=${Date.now()}`, { cache: 'no-store' });
        if (!resp.ok) return;
        const data = await resp.json();
        if (requestSeq !== refreshRequestSeq) return;
        applyPortfolioData(data);
    } catch (e) {}
}


// classifyAllocationBucket / classifyLookThroughBucket 来自 /classify.js(与 m.html 共享)

function buildAllocationGroups(data, rate) {
    // 两遍: 先算总额(观察仓/核心个股按占比<5%/≥5%分流, 需要 total), 再归组
    const items = [];
    let total = 0;
    (data.accounts || []).forEach(acc => {
        const cur = acc.currency || 'CNY';
        const mul = cur === 'USD' ? rate : cur === 'HKD' ? rate / 7.8 : 1;
        (acc.holdings || []).forEach(h => {
            // 含在途申购: 021000 等场外基金的 pending 金额已是确定投入,不计会让纳指占比失真
            const valueCNY = ((h.marketValue || 0) + (h.pendingAmount || 0)) * mul;
            if (valueCNY <= 0) return;
            total += valueCNY;
            items.push({ h, valueCNY });
        });
    });
    const groups = {};
    items.forEach(({ h, valueCNY }) => {
        const rule = planDoc && planDoc.channels && planDoc.channels.symbols ? planDoc.channels.symbols[String(h.symbol || '').toUpperCase()] : null;
        const bucket = classifyPieGroup(h, total > 0 ? valueCNY / total * 100 : 0, rule); // 与 m.html 同口径(逻辑在 classify.js; 有建仓规则的小仓也算个股)
        groups[bucket] = (groups[bucket] || 0) + valueCNY;
    });
    // 现金并入饼图, 单独一组
    let cashCNY = 0;
    (data.accounts || []).forEach(acc => {
        const cur = acc.currency || 'CNY';
        const mul = cur === 'USD' ? rate : cur === 'HKD' ? rate / 7.8 : 1;
        cashCNY += (parseFloat(acc.cash) || 0) * mul;
    });
    if (cashCNY > 0) groups['现金'] = (groups['现金'] || 0) + cashCNY;
    return Object.entries(groups)
        .filter(([, value]) => value > 0)
        .map(([name, value]) => ({ name, value }))
        .sort((a, b) => ((a.name === '现金' ? 1 : 0) - (b.name === '现金' ? 1 : 0)) || b.value - a.value);   // 现金沉底
}

// 计划与规则来自 plan.json(本地权威/随 deploy 上远端); 持仓/在途来自 /api/data。
// 设计意图: 让页面第一眼回答"计划今天正常吗",而不是"今天涨跌多少"。只读,不提供任何调仓入口。
let planDoc = null;
authedFetch('/plan.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null)   // 规则源永远取最新(服务器对静态文件有 5 分钟缓存)

// W1 左栏(你拥有 + 上次种下 + 竖排信条)和右栏持仓列表; 规则读 plan.json, 不在这里硬编码
let _dcLastData = null;
function renderDiscipline(data) {
    if (!planDoc || !data || !data.accounts) return;
    const rate = (data.exchangeRate && data.exchangeRate.USD_CNY) || 7;
    const mulOf = c => c === 'USD' ? rate : c === 'HKD' ? rate / 7.8 : 1;
    const ch = planDoc.channels || {};
    const idxPlan = (ch && ch.indexPlan) || {};
    const idxSyms = Array.isArray(idxPlan.symbols) ? idxPlan.symbols : [];
    const now = new Date(), ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    // 每只: 金额 = Σ Δ(成本价×股数)(sync 记录) 或 buy 记录 股数×价; 只取本月
    const monthBuyOf = (h) => {
        let usd = 0, shares = 0, last = null, lastSell = null; const byDay = {}, sellByDay = {};
        const tx = (h && Array.isArray(h.transactions) ? h.transactions : []).filter(t => t && t.date).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
        let prevShares = null, prevCostVal = null;
        tx.forEach(t => {
            const sh = Number(t.shares) || 0, px = Number(t.price) || 0;
            if (t.type === 'sync') {
                const costVal = sh * px;
                if (prevShares !== null) {
                    const dSh = sh - prevShares;
                    if (dSh > 0) {
                        const dAmt = (prevCostVal !== null && costVal > prevCostVal) ? costVal - prevCostVal : dSh * px;
                        last = String(t.date).slice(0, 10); byDay[last] = (byDay[last] || 0) + dSh;
                        if (String(t.date).slice(0, 7) === ym) { usd += dAmt; shares += dSh; }
                    } else if (dSh < 0) { lastSell = String(t.date).slice(0, 10); sellByDay[lastSell] = (sellByDay[lastSell] || 0) - dSh; }
                }
                prevShares = sh; prevCostVal = costVal;
            } else if (t.type === 'buy' || t.type === 'sell') {
                const dSh = t.type === 'buy' ? sh : -sh;
                if (dSh > 0) { last = String(t.date).slice(0, 10); byDay[last] = (byDay[last] || 0) + dSh; if (String(t.date).slice(0, 7) === ym) { usd += dSh * px; shares += dSh; } }
                else if (dSh < 0) { lastSell = String(t.date).slice(0, 10); sellByDay[lastSell] = (sellByDay[lastSell] || 0) - dSh; }
                prevShares = (prevShares === null ? 0 : prevShares) + dSh;
                prevCostVal = (prevCostVal === null ? 0 : prevCostVal) + dSh * px;
            }
        });
        return { usd, shares, last, lastShares: last ? byDay[last] : 0, lastSell, lastSellShares: lastSell ? sellByDay[lastSell] : 0 };
    };
    // 首页主角: plan.json home.hero = auto(定投名单里持有最多的一只, 没写定投就是占比最大的一只) | shares(home.symbols) | total | none
    const home = planDoc.home || {};
    const items = [];
    data.accounts.forEach(acc => { const m = mulOf(acc.currency || 'CNY'); (acc.holdings || []).forEach(h => { if ((Number(h.shares) || 0) > 0) items.push({ h, v: ((h.marketValue || 0) + (h.pendingAmount || 0)) * m }); }); });
    items.sort((a, b) => b.v - a.v);
    let mode = home.hero || 'auto', heroSyms = Array.isArray(home.symbols) ? home.symbols.filter(Boolean) : [];
    if (mode === 'auto') { mode = 'shares'; const idxHeld = items.filter(x => idxSyms.includes(x.h.symbol)); heroSyms = idxHeld.length ? [idxHeld[0].h.symbol] : items.length ? [items[0].h.symbol] : []; }
    const shFmt = v => v >= 1000 ? Math.round(v).toLocaleString('en-US') : String(v >= 0.05 ? Math.round(v * 10) / 10 : Math.round(v * 100) / 100).replace(/\.0$/, '');
    const held = items.filter(x => heroSyms.includes(x.h.symbol));
    let heroHtml = '';
    if (mode === 'shares' && held.length) {
        const ownSh = held.reduce((sum, x) => sum + (Number(x.h.shares) || 0), 0), unit = w1Unit(held[0].h);
        // 最近一次变动: 买入 → 「种」; 卖出 → 「收」。日期 11 个月以内写「M 月 D 日」, 更久写「YYYY 年 M 月」
        let lastDay = null, lastSh = 0, sellDay = null, sellSh = 0;
        held.forEach(x => {
            const r = monthBuyOf(x.h);
            if (r.last && (!lastDay || r.last > lastDay)) { lastDay = r.last; lastSh = r.lastShares; } else if (r.last && r.last === lastDay) lastSh += r.lastShares;
            if (r.lastSell && (!sellDay || r.lastSell > sellDay)) { sellDay = r.lastSell; sellSh = r.lastSellShares; } else if (r.lastSell && r.lastSell === sellDay) sellSh += r.lastSellShares;
        });
        const harvest = !!sellDay && (!lastDay || sellDay > lastDay);
        const evDay = harvest ? sellDay : lastDay, evSh = harvest ? sellSh : lastSh;
        const dayTxt = d => { const y = Number(d.slice(0, 4)), m = Number(d.slice(5, 7)); const months = (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m); return months >= 11 ? `${y} 年 ${m} 月` : `${m} 月 ${Number(d.slice(8, 10))} 日`; };
        const caption = home.caption || (held.length === 1 ? w1ShortName(held[0].h.name || held[0].h.symbol) : heroSyms.join(' / '));
        heroHtml = `
        <div class="w1-own">
            <div class="w1-lab" style="letter-spacing:3px">你拥有</div>
            <div style="margin-top:10px;white-space:nowrap"><span class="w1-n">${shFmt(ownSh)}</span><span style="font-size:19px"> ${unit}</span></div>
            <div class="w1-lab" style="letter-spacing:2px;margin-top:10px">${esc(caption)}</div>
            ${evDay ? `<div class="w1-last"><span class="w1-seal">${harvest ? '收' : '种'}</span><span>${dayTxt(evDay)}，${harvest ? '收下' : '种下'} ${shFmt(evSh)} ${unit}。</span></div>` : ''}
        </div>`;
    } else if (mode === 'total') {
        let totalAll = 0;
        data.accounts.forEach(acc => { const m = mulOf(acc.currency || 'CNY'); totalAll += (acc.cash || 0) * m; (acc.holdings || []).forEach(h => { totalAll += ((h.marketValue || 0) + (h.pendingAmount || 0)) * m; }); });
        heroHtml = `
        <div class="w1-own">
            <div class="w1-lab" style="letter-spacing:3px">总资产</div>
            <div style="margin-top:12px;white-space:nowrap"><span class="w1-n mask-amount" style="font-size:46px">¥ ${Math.round(totalAll).toLocaleString('en-US')}</span></div>
            ${home.caption ? `<div class="w1-lab" style="letter-spacing:2px;margin-top:12px">${esc(home.caption)}</div>` : ''}
        </div>`;
    }
    // 三句话: plan.json creed.lines, 竖排, 第一句是主句; 没写就不显示
    const lines = ((planDoc.creed && (planDoc.creed.lines || planDoc.creed.threeLines)) || []).filter(Boolean).slice(0, 3);
    const hero1 = lines[0], rest = lines.slice(1);
    setHtmlIfChanged(document.getElementById('w1Left'), heroHtml + (!hero1 ? '' : `
        <div class="w1-creed">
            <div class="w1-cv main">${esc(hero1)}</div>
            ${rest.map((t, i) => `<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:${46 * (i + 1)}px"><div class="w1-cv sub">${esc(t)}</div>${i === rest.length - 1 ? '<span class="w1-seal" style="width:24px;height:24px">守</span>' : ''}</div>`).join('')}
        </div>`));
    renderW1List(data, mulOf);
    _dcLastData = data;
}

const W1_COMPANY_INFO = { GOOGL: ['Alphabet', '谷歌'], GOOG: ['Alphabet', '谷歌'], TSLA: ['Tesla', '特斯拉'], 'BRK.B': ['Berkshire', '伯克希尔'], MU: ['Micron', '美光'], AAPL: ['Apple', '苹果'], MSFT: ['Microsoft', '微软'], NVDA: ['NVIDIA', '英伟达'], AMZN: ['Amazon', '亚马逊'], META: ['Meta', ''], '600519': ['贵州茅台', ''] };
const W1_STOCK_PAL = ['#f59e0b', '#ef4444', '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#14b8a6', '#a855f7', '#eab308', '#3b82f6'];
function w1ShortName(n){ const t = String(n).replace(/[（(]QDII[)）]/gi, '').replace(/发起式?/g, '').replace(/指数ETF$/, '').replace(/(指数|主题|混合|股票)[ACI]$/, '$1').trim(); return t || String(n); }
function w1Unit(x){ if (x.market === 'crypto') return '枚'; if (x.market === 'fund') return '份'; if ((x.market === 'sh' || x.market === 'sz') && /^(5|15|16|18)/.test(String(x.symbol || ''))) return '份'; return '股'; }
function w1ShTxt(sh){ return sh >= 1000 ? Math.round(sh).toLocaleString('en-US') : (Math.abs(sh - Math.round(sh)) < 0.05 ? String(Math.round(sh)) : sh.toFixed(1)); }
let w1OtherOpen = localStorage.getItem('w1OtherOpen') === '1';
function w1ToggleOther(){ w1OtherOpen = !w1OtherOpen; localStorage.setItem('w1OtherOpen', w1OtherOpen ? '1' : '0'); if (_dcLastData) renderDiscipline(_dcLastData); }
function renderW1List(data, mulOf){
    const el = document.getElementById('w1List'); if (!el) return;
    const symCfg = (planDoc && planDoc.channels && planDoc.channels.symbols) || {};
    const singleCap = (planDoc && planDoc.targetAllocation && planDoc.targetAllocation.singleCapPct) || 20;
    const cos = [], idx = [], oth = [], all = []; let total = 0;
    data.accounts.forEach((acc, ai) => {
        const m = mulOf(acc.currency || 'CNY');
        const cash = (acc.cash || 0) * m;
        if (cash > 0.5) { total += cash; oth.push({ cash: true, ai, v: cash, name: '现金', sub: acc.name || '' }); }
        (acc.holdings || []).forEach((h, hi) => {
            const v = ((h.marketValue || 0) + (h.pendingAmount || 0)) * m, sh = Number(h.shares) || 0;
            if (v <= 0 && sh <= 0) return;
            total += Math.max(0, v);
            all.push({ h, ai, hi, v: Math.max(0, v), sh });
        });
    });
    const pct = v => total > 0 ? v / total * 100 : 0;
    // 分组与饼图同口径: 指数 / 你的公司(个股, 且不是小仓观察仓) / 其他(观察仓、警戒仓、赠股、加密、现金)
    all.forEach(it => {
        const b = classifyAllocationBucket(it.h), rule = symCfg[String(it.h.symbol || '').toUpperCase()];
        const watch = pct(it.v) < 5 && !(rule && rule.type === 'band');
        if (PIE_INDEX_BUCKETS.includes(b)) idx.push(it); else if (isIndividualStock(it.h) && !watch) cos.push(it); else oth.push(it);
    });
    const sum = a => a.reduce((s, x) => s + x.v, 0);
    const tOf = x => Number((symCfg[String(x.h.symbol || '').toUpperCase()] || {}).targetShares) || 0;
    const trim = x => tOf(x) > 0 && x.sh > tOf(x) + 0.5;
    const rank = cos.slice().sort((a, b) => b.v - a.v).map(x => x.h.symbol);
    const row = (x, dot, nm, cn, sub) => `<div class="w1-row" onclick="w1OpenDetail(${x.ai},${x.hi})"><div class="l"><i class="w1-dot" style="background:${dot}"></i><div style="min-width:0"><div class="w1-nm">${esc(nm)}${cn ? `<small>${esc(cn)}</small>` : ''}</div><div class="w1-sub">${sub}</div></div></div><div class="w1-sh">${w1ShTxt(x.sh)}<small>${w1Unit(x.h)}</small></div></div>`;
    const coRows = cos.slice().sort((a, b) => (trim(a) - trim(b)) || (b.v - a.v)).map(x => {
        const sym = String(x.h.symbol || '').toUpperCase(), c = symCfg[sym] || {}, t = tOf(x), w = pct(x.v), info = W1_COMPANY_INFO[sym] || [];
        const cap = c.type === 'band' ? Number(c.sealAtPct) || singleCap : singleCap;
        const st = t > 0 ? (x.sh > t + 0.5 ? `目标 ${t} 股` : x.sh >= t - 0.5 ? '已买够' : `还差 ${Math.round(t - x.sh)} 股`) : '';
        const full = c.company || info[0] || w1ShortName(x.h.name || sym), cn = info[1] && info[1] !== full ? info[1] : '';
        return row(x, W1_STOCK_PAL[Math.max(0, rank.indexOf(x.h.symbol)) % W1_STOCK_PAL.length], full, cn, `占 <span class="${t > 0 && w > cap ? 'w1-warn' : ''}">${w.toFixed(1)}%</span>${st ? ' · ' + st : ''}`);
    }).join('');
    const plain = (x, dot) => row(x, dot, w1ShortName(x.h.name || x.h.symbol), '', `${esc(x.h.symbol)} · 占 ${pct(x.v).toFixed(1)}%${x.h.autoDca && x.h.autoDca.on ? '<span class="w1-tag">定投中</span>' : ''}`);
    const idxRows = idx.slice().sort((a, b) => b.v - a.v).map(x => plain(x, '#6366f1')).join('');
    const othRows = oth.slice().sort((a, b) => b.v - a.v).map(x => x.cash
        ? `<div class="w1-row" style="cursor:default"><div class="l"><i class="w1-dot" style="background:#94a3b8"></i><div><div class="w1-nm">现金</div><div class="w1-sub">${esc(x.sub)} · 占 ${pct(x.v).toFixed(1)}%</div></div></div><div class="w1-sh mask-amount" style="font-size:17px">¥${Math.round(x.v).toLocaleString('en-US')}</div></div>`
        : plain(x, '#a1a1aa')).join('');
    setHtmlIfChanged(el, `
        ${coRows ? `<div class="w1-sec">你的公司 · ${pct(sum(cos)).toFixed(1)}%</div><div class="w1-card">${coRows}</div>` : ''}
        ${idxRows ? `<div class="w1-sec">指数 · ${pct(sum(idx)).toFixed(1)}%</div><div class="w1-card">${idxRows}</div>` : ''}
        ${othRows ? `<div class="w1-card" style="margin-top:18px"><div class="w1-row" onclick="w1ToggleOther()"><div class="l"><i class="w1-dot" style="background:#a1a1aa"></i><div class="w1-nm">其他</div></div><div style="font-weight:700">${pct(sum(oth)).toFixed(1)}% <span style="color:var(--w-dim);font-weight:500;margin-left:8px;display:inline-block;transform:rotate(${w1OtherOpen ? 90 : 0}deg)">›</span></div></div>${w1OtherOpen ? othRows : ''}</div>` : ''}`);
}

let w1DetailTarget = null;
function w1LastBuy(h){   // 最近一次买入的日期和当天买入数量(sync 记录取股数增量, buy 记录直接算)
    const tx = (h && Array.isArray(h.transactions) ? h.transactions : []).filter(t => t && t.date).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
    let prev = null, last = null; const byDay = {};
    tx.forEach(t => {
        const n = Number(t.shares) || 0; let d = 0;
        if (t.type === 'sync') { if (prev !== null) d = n - prev; prev = n; }
        else if (t.type === 'buy') { d = n; prev = (prev === null ? 0 : prev) + n; }
        else if (t.type === 'sell') { prev = (prev === null ? 0 : prev) - n; }
        if (d > 1e-6) { last = String(t.date).slice(0, 10); byDay[last] = (byDay[last] || 0) + d; }
    });
    return last ? { day: last, shares: byDay[last] } : null;
}
function w1OpenDetail(ai, hi){
    const acc = portfolioData && portfolioData.accounts[ai], h = acc && acc.holdings[hi];
    if (!h) return;
    w1CloseMoney();
    w1DetailTarget = { ai, hi };
    const rate = portfolioData.rateInfo?.USD_CNY || portfolioData.exchangeRate?.USD_CNY || 7;
    const mulOf = c => c === 'USD' ? rate : c === 'HKD' ? rate / 7.8 : 1;
    const cur = acc.currency || 'CNY', mul = mulOf(cur), sym = cur === 'USD' ? '$' : cur === 'HKD' ? 'HK$' : '¥';
    let total = 0;
    portfolioData.accounts.forEach(a => { const m = mulOf(a.currency || 'CNY'); total += (a.cash || 0) * m; (a.holdings || []).forEach(x => { total += Math.max(0, ((x.marketValue || 0) + (x.pendingAmount || 0)) * m); }); });
    const symU = String(h.symbol || '').toUpperCase(), info = W1_COMPANY_INFO[symU] || [];
    const rule = ((planDoc && planDoc.channels && planDoc.channels.symbols) || {})[symU];
    const sh = Number(h.shares) || 0, unit = w1Unit(h), tgt = rule ? Number(rule.targetShares) || 0 : 0;
    const mv = h.marketValue || (h.currentPrice || 0) * sh, cost = h.costValue || (h.costPrice || 0) * sh;
    const weight = total > 0 ? (mv + (h.pendingAmount || 0)) * mul / total * 100 : 0;
    const $ = id => document.getElementById(id);
    $('w1dName').textContent = (rule && rule.company) || info[0] || w1ShortName(h.name || h.symbol);
    $('w1dSymbol').textContent = `${h.symbol || ''} · ${acc.name || ''}`;
    $('w1dShares').textContent = w1ShTxt(sh);
    $('w1dUnit').textContent = ' ' + unit;
    const st = tgt > 0 ? (sh > tgt + 0.5 ? `目标 ${tgt} 股` : sh >= tgt - 0.5 ? '已买够' : `还差 ${Math.round(tgt - sh)} 股`) : '';
    $('w1dStatus').textContent = `占 ${weight.toFixed(1)}%${st ? ' · ' + st : ''}`;
    const lb = w1LastBuy(h);
    $('w1dLast').style.display = lb ? 'flex' : 'none';
    if (lb) $('w1dLastTxt').textContent = `${Number(lb.day.slice(5, 7))} 月 ${Number(lb.day.slice(8, 10))} 日，种下 ${w1ShTxt(lb.shares)} ${unit}。`;
    // 价格与成本: 整块只在眼睛打开时出现; 电脑端配色惯例涨红跌绿
    const pnl = h.pnl ?? (mv - cost), pnlPct = cost > 0 ? pnl / cost * 100 : 0, dayPct = h.changePercent || 0;
    const n2 = v => Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }), n0 = v => Math.round(v).toLocaleString('en-US');
    $('w1dPx').innerHTML = `
        <div><span>当前价格 · 今日</span><span><b>${sym} ${n2(h.currentPrice)}</b> <span class="${dayPct >= 0 ? 'w1-up' : 'w1-dn'}">${dayPct >= 0 ? '+' : ''}${dayPct.toFixed(2)}%</span></span></div>
        <div><span>总市值</span><b>¥${n0(mv * mul)}</b></div>
        <div><span>单位成本 · 总成本</span><span>${sym} ${n2(h.costPrice)} · ¥${n0(cost * mul)}</span></div>
        <div><span>持仓盈亏</span><b class="${pnl >= 0 ? 'w1-up' : 'w1-dn'}">${pnl >= 0 ? '+' : '-'}¥${n0(Math.abs(pnl * mul))} (${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(1)}%)</b></div>`;
    // 只读说明: 买入规则 / 自动定投(修改在手机上)
    const notes = [];
    if (rule && (tgt > 0 || rule.type === 'band')) notes.push(`买入规则：${tgt > 0 ? `目标 ${tgt} 股` : ''}${tgt > 0 && rule.sealAtPct ? ' · ' : ''}${rule.sealAtPct ? `占比上限 ${rule.sealAtPct}%` : ''}`);
    if (h.autoDca && h.autoDca.on) notes.push(`自动定投：开，每个交易日 ¥${h.autoDca.amount}`);
    $('w1dNotes').innerHTML = notes.map(esc).join('<br>');
    $('w1DetailDim').style.left = w1DimLeft();

function w1DrawCurve(){
    if (!w1MoneyOpen() || !portfolioData || !Array.isArray(portfolioData.history) || !portfolioData.history.length) return;
    const snaps = portfolioData.history;
    const cut = W1_RANGE_DAYS[w1Range] ? Date.now() - W1_RANGE_DAYS[w1Range] * 86400000 : 0;
    let pts = cut ? snaps.filter(x => new Date(x.t).getTime() >= cut) : snaps;
    pts = tradingDaySnapshots(pts);
    if (pts.length < 2) pts = tradingDaySnapshots(snaps).slice(-30);
    pts = sampleByTime(pts, 220);
    const isPnl = w1CurveMode === 'pnl';
    const labels = pts.map(x => x.t), values = isPnl ? pts.map(x => (x.v || 0) - (x.c || 0) + (x.r || 0)) : pts.map(x => x.v);   // 累计盈亏 = 市值 − 成本 + 已实现(与手机端同口径)
    const dataset = {
        data: values, borderColor: '#2dd4bf', borderWidth: 2.2, fill: true, tension: 0.35, pointRadius: 0, spanGaps: true,
        backgroundColor: c => { const g = c.chart.ctx.createLinearGradient(0, 0, 0, 240); g.addColorStop(0, 'rgba(45,212,191,0.26)'); g.addColorStop(1, 'rgba(45,212,191,0)'); return g; },
    };
    if (w1Chart) { w1Chart.data.labels = labels; w1Chart.data.datasets = [dataset]; w1Chart.update('none'); return; }
    w1Chart = new Chart(document.getElementById('w1Curve').getContext('2d'), {
        type: 'line', data: { labels, datasets: [dataset] },
        options: {
            responsive: true, maintainAspectRatio: false, animation: { duration: 0 },
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false }, tooltip: { displayColors: false, filter: () => !maskMode, callbacks: {   // 眼睛没打开时悬停不显示金额
                title: it => { const d = new Date(it[0].label); return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`; },
                label: c => { const usd = w1Cur === 'USD', r = (portfolioData.rateInfo && portfolioData.rateInfo.USD_CNY) || (portfolioData.exchangeRate && portfolioData.exchangeRate.USD_CNY) || 7; const v = usd ? c.parsed.y / r : c.parsed.y; return (w1CurveMode === 'pnl' ? (v >= 0 ? '+' : '-') : '') + (usd ? '$ ' : '¥ ') + Math.round(Math.abs(v)).toLocaleString('en-US'); },
            } } },
            scales: { x: { display: false }, y: { display: false } },
        },
    });
}


function render(data, { realtimeOnly = false } = {}) {
    document.getElementById('updateTime').textContent = new Date(data.timestamp).toLocaleTimeString('zh-CN');

    const rate = data.rateInfo?.USD_CNY || data.exchangeRate?.USD_CNY || 6.88;
    document.getElementById('rateDisplay').textContent = rate;
    if (data.rateInfo) {
        if (data.rateInfo.lastUpdate) {
            const t = new Date(data.rateInfo.lastUpdate);
            document.getElementById('rateUpdateTime').textContent =
                `汇率 ${t.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}`;
        }
    } else {
        document.getElementById('rateUpdateTime').textContent = '';
    }

    let totalCNY = 0, totalCost = 0, todayChg = 0, totalPending = 0;
    let allHoldings = [];

    let totalCash = 0;
    data.accounts.forEach(acc => {
        const cur = acc.currency || 'CNY';
        const cashMul = cur === 'USD' ? rate : cur === 'HKD' ? rate / 7.8 : 1;
        const accCash = acc.cash || 0;
            if (accCash > 0) {
                const cashCNY = accCash * cashMul;
                totalCash += cashCNY;
                totalCNY += cashCNY;
                totalCost += cashCNY; // cash has no P&L
                allHoldings.push({ name: `${acc.name}-现金`, valueCNY: cashCNY });
            }
        acc.holdings.forEach(h => {
            const mv = h.marketValue || 0;
            const cv = h.costValue || 0;
            const pend = h.pendingAmount || 0; // 场外基金在途申购: 计入总额(成本=市值,无盈亏),与手机端口径一致
            const dayChg = (h.change || 0) * h.shares;
            let mvCNY, cvCNY, dayChgCNY, pendCNY;
            if (cur === 'USD') {
                mvCNY = mv * rate; cvCNY = cv * rate; dayChgCNY = dayChg * rate; pendCNY = pend * rate;
            } else if (cur === 'HKD') {
                const hkRate = rate / 7.8;
                mvCNY = mv * hkRate; cvCNY = cv * hkRate; dayChgCNY = dayChg * hkRate; pendCNY = pend * hkRate;
            } else {
                mvCNY = mv; cvCNY = cv; dayChgCNY = dayChg; pendCNY = pend;
            }
            totalCNY += mvCNY + pendCNY;
            totalCost += cvCNY + pendCNY;
            todayChg += dayChgCNY;
            totalPending += pendCNY;
            allHoldings.push({ name: h.name, valueCNY: mvCNY + pendCNY });
        });
    });

    const totalPnl = totalCNY - totalCost;
    const totalPnlPct = totalCost > 0 ? (totalPnl / totalCost) * 100 : 0;
    const todayPct = (totalCNY - todayChg) > 0 ? (todayChg / (totalCNY - todayChg)) * 100 : 0;

    // Summary cards
    // 点金额在 ¥ / $ 之间切换(与手机端一致); 盈亏两行和曲线悬停跟着换
    const usd = w1Cur === 'USD', sym = usd ? '$' : '¥', cv = v => usd ? v / rate : v;
    document.getElementById('totalAssets').textContent = `${sym} ${Math.round(cv(totalCNY)).toLocaleString('en-US')}`;
    // 抽屉里的盈亏两行(只在眼睛打开时显示); 电脑端配色惯例: 涨红跌绿
    const plLine = (v, p, lab) => `<div><span class="${v >= 0 ? 'w1-up' : 'w1-dn'}">${v >= 0 ? '+' : '-'}${sym}${Math.round(Math.abs(cv(v))).toLocaleString('en-US')} (${p >= 0 ? '+' : ''}${p.toFixed(1)}%)</span><i>${lab}</i></div>`;
    document.getElementById('w1Pnl').innerHTML = plLine(totalPnl, totalPnlPct, '全部时间') + plLine(todayChg, todayPct, '今日');
    document.getElementById('w1Fresh').textContent = new Date(data.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

    // Today change / Top holding cards removed from UI — keep calculation silent for holdings sort
    if (allHoldings.length > 0) {
        allHoldings.sort((a, b) => b.valueCNY - a.valueCNY);
    }

    if (!realtimeOnly) {
        renderDiscipline(data);
        // 记分卡已并入 renderDiscipline 的第三块瓦片(W2, )
    }
    updateTankHud();

    if (realtimeOnly) {
        const chartHash = allHoldings.map(h => h.name + ':' + Math.round(h.valueCNY / 1000)).join('|');
        if (chartHash !== lastChartHash) {
            lastChartHash = chartHash;
            updateCharts(data, rate);
        }
        return;
    }

    // Charts - only rebuild if holdings changed
    // Round value to nearest ¥1000 so sub-% price drifts don't trigger re-render every tick
    const chartHash = allHoldings.map(h => h.name + ':' + Math.round(h.valueCNY / 1000)).join('|');
    if (chartHash !== lastChartHash) {
        lastChartHash = chartHash;
        updateCharts(data, rate);
    }

    // Fish tank
    buildFishFromData(data);
}

// 饼图软分组: 纳指/标普仍是各自独立扇区,但同一靛蓝色系相邻排列 → 视觉上读成"指数"整体(与手机端一致)
const PIE_INDEX_BUCKETS = ['纳指指数类', '标普'];
const PIE_LABEL = { '纳指指数类': '纳指100' };
function updateCharts(data, rate) {
    const palette = {
        '指数': '#6366f1',       // 纳指+标普合成一块, 与手机端同色
        '纳指指数类': '#6366f1', // 靛蓝
        '标普': '#818cf8',       // 浅靛蓝(同色系,软合并入指数)
        '加密资产': '#8b5cf6',
        '观察仓': '#14b8a6',     // teal, 与 m.html 同色
        '其他': '#a1a1aa',       // 警戒仓+赠股, 与手机端同色
        '现金': '#94a3b8',       // 灰, 与手机端 BUCKET_PALETTE 现金同色
    };
    const stockPalette = ['#f59e0b', '#ef4444', '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#14b8a6', '#a855f7', '#eab308', '#3b82f6'];
    // 与手机端统一: 纳指+标普合成一块「指数」, 现金+加密并入「其他」; 指数排最前, 其他排最后, 中间按金额
    const merged = {};
    buildAllocationGroups(data, rate).forEach(g => {
        const n = PIE_INDEX_BUCKETS.includes(g.name) ? '指数' : (g.name === '现金' || g.name === '加密资产' || g.name === '观察仓') ? '其他' : g.name;
        merged[n] = (merged[n] || 0) + g.value;
    });
    const groups = Object.entries(merged).filter(([, v]) => v > 0).map(([name, value]) => ({ name, value }))
        .sort((a, b) => {
            if ((a.name === '其他') !== (b.name === '其他')) return a.name === '其他' ? 1 : -1;
            if ((a.name === '指数') !== (b.name === '指数')) return a.name === '指数' ? -1 : 1;
            return b.value - a.value;
        });
    const pieTotal = groups.reduce((s2, g) => s2 + g.value, 0);
    const idxG = groups.find(g => g.name === '指数') || groups[0];
    const centerLab = document.getElementById('portfolioCenterLab'); if (centerLab) centerLab.textContent = idxG ? (PIE_LABEL[idxG.name] || idxG.name) : '';
    const centerEl = document.getElementById('portfolioCenter');
    if (centerEl) centerEl.innerHTML = pieTotal > 0 ? `${Math.round((idxG ? idxG.value : 0) / pieTotal * 100)}<span style="font-size:16px">%</span>` : '--';
    let stockColorIndex = 0;
    const bgColors = groups.map(g => {
        if (palette[g.name]) return palette[g.name];
        const color = stockPalette[stockColorIndex % stockPalette.length];
        stockColorIndex += 1;
        return color;
    });
    const labels = groups.map(g => g.name);
    const values = groups.map(g => Math.max(0, g.value));
    if (portfolioChart) {
        // Incremental update — no destroy/animation, avoids visible flicker
        portfolioChart.data.labels = labels;
        portfolioChart.data.datasets[0].data = values;
        portfolioChart.data.datasets[0].backgroundColor = bgColors;
        portfolioChart.update('none');
    } else {
        const ctx1 = document.getElementById('portfolioChart').getContext('2d');
        portfolioChart = new Chart(ctx1, {
            type: 'doughnut',
            data: { labels, datasets: [{ data: values, backgroundColor: bgColors, borderWidth: 0 }] },
            options: {
                responsive: true, animation: { duration: 0 }, cutout: '70%',
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => {
                                const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                const pct = total > 0 ? (ctx.parsed / total * 100).toFixed(1) : 0;
                                return `${PIE_LABEL[ctx.label] || ctx.label}: ${pct}%`;   // 不显示金额
                            }
                        }
                    }
                }
            }
        });
    }

    // Custom HTML legend below chart (more control over spacing than Chart.js built-in)
    const legendEl = document.getElementById('portfolioLegend');
    if (legendEl) {
        legendEl.innerHTML = groups.map((g, i) =>
            `<span class="inline-flex items-center" style="gap:12px">
                <span class="inline-block rounded-full" style="width:9px;height:9px;background:${bgColors[i]}"></span>
                ${esc(PIE_LABEL[g.name] || g.name)}
            </span>`
        ).join('');
    }
}


function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let historyLoadedRange = null;
let historyLoadPromise = null;
let historyGapPromise = null;
const historyRangeCache = new Map();

async function syncHistoryGap(meta) {
    const history = portfolioData?.history;
    if (!meta?.lastSnapshotAt || !Array.isArray(history) || !history.length) return;
    const last = history[history.length - 1];
    if (new Date(meta.lastSnapshotAt).getTime() <= new Date(last.t).getTime()) return;
    if (historyGapPromise) return historyGapPromise;
    const params = new URLSearchParams({ since: last.t, maxPoints: '5000' });
    historyGapPromise = authedFetch(`/api/history?${params}`, { cache: 'no-store' })
        .then(async r => {
            if (!r.ok) throw new Error(`history gap HTTP ${r.status}`);
            const p = await r.json();
            mergeHistoryPoints(p.history || [], p.riskMetrics);
        })
        .catch(() => {})
        .finally(() => { historyGapPromise = null; });
    return historyGapPromise;
}

async function ensureHistoryLoaded(range = chartRange, { benchmarks = false, force = false } = {}) {
    if (!portfolioData) return;
    const hasBenchmarks = portfolioData.benchmarks
        && Object.values(portfolioData.benchmarks).some(points => Array.isArray(points) && points.length >= 2);
    const needBenchmarks = benchmarks && !hasBenchmarks;
    if (!force && historyLoadedRange === range && !needBenchmarks) return;
    if (!force && historyRangeCache.has(range) && !needBenchmarks) {
        portfolioData.history = historyRangeCache.get(range);
        historyLoadedRange = range;
        w1DrawCurve();
        return;
    }
    if (historyLoadPromise) return historyLoadPromise.then(() => ensureHistoryLoaded(range, { benchmarks, force }));
    const params = new URLSearchParams({ range, maxPoints: range === 'all' ? '1800' : '1200' });
    if (benchmarks) params.set('benchmarks', '1');
    historyLoadPromise = authedFetch(`/api/history?${params}`, { cache: 'no-store' })
        .then(async r => {
            if (!r.ok) throw new Error(`history HTTP ${r.status}`);
            const payload = await r.json();
            const fetched = Array.isArray(payload.history) ? payload.history : [];
            const coveredTs = new Date(payload.lastSnapshotAt || 0).getTime();
            const liveTail = (portfolioData.history || []).filter(snapshot => {
                const ts = new Date(snapshot?.t).getTime();
                return Number.isFinite(ts) && (!Number.isFinite(coveredTs) || ts > coveredTs);
            });
            portfolioData.history = mergeHistorySeries(fetched, liveTail);
            historyRangeCache.set(range, portfolioData.history);
            if (!liveTail.length) portfolioData.riskMetrics = payload.riskMetrics || portfolioData.riskMetrics;
            if (payload.benchmarks) portfolioData.benchmarks = payload.benchmarks;
            historyLoadedRange = range;
            w1DrawCurve();
            syncHistoryGap(portfolioData.historyMeta);
        })
        .catch(e => console.warn('历史数据加载失败:', e.message))
        .finally(() => { historyLoadPromise = null; });
    return historyLoadPromise;
}

// ---- Fish Tank ----
const fishCanvas = document.getElementById('fishTank');
const fishCtx = fishCanvas.getContext('2d');
let fishList = [];
const FISH_SPEED = 0.6;   // 鱼游速全局系数; 涨跌快慢的相对关系不变
let _fishLastT = null;    // 上一帧时间戳, 用于按 60fps 归一位移(120Hz 屏不再双倍速)
let bubbles = [];
let tankDust = [];
let fishDataReady = false;

function initFishTank() {
    const dpr = window.devicePixelRatio || 1;
    const rect = fishCanvas.getBoundingClientRect();
    fishCanvas.width = rect.width * dpr;
    fishCanvas.height = rect.height * dpr;
    fishCtx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;
    tankDust = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 0.5 + Math.random() * 1.2, v: 0.05 + Math.random() * 0.15, a: 0.12 + Math.random() * 0.3, o: Math.random() * 9 }));
    // 出生在画布外的鱼(数据到达时鱼缸 tab 未开、画布 0×0)重新落位, 不再从左上角游进来
    if (W > 0 && H > 0) fishList.forEach(f => {
        if (f.x < 0 || f.x > W || f.y < 0 || f.y > H) { f.x = 60 + Math.random() * Math.max(1, W - 120); f.y = 50 + Math.random() * Math.max(1, H - 130); }
    });
}

// ===== 鱼缸 Q1「深蓝海水」 =====
// 鱼的画法(下面六个 drawXxx)没动; 改的是: 颜色 = 每种鱼本来的颜色(不再涨红跌绿), 名牌 = 名称 + 股数(不再是今日涨跌), 游速固定(不再跟涨跌), 场景重画。
// 一个持仓一条鱼(不再按类别合并), 种类按占比排名: 最大鲨鱼, 其次锦鲤、神仙鱼、小丑鱼, 再小是灯鱼, 最小的是河豚。
function assignFishType(rank, total) {
    if (rank === 0) return 'shark';
    if (rank === 1) return 'koi';
    if (rank === 2) return 'angel';
    if (rank <= 4) return 'clown';
    if (rank === total - 1 && total > 5) return 'puffer';
    return 'tetra';
}
const FISH_NATURAL = {
    shark: { body: '#6b7f93', accent: '#3b4a5c', belly: '#e6edf3', stripe: '#9fb0c0' },
    koi: { body: '#f4efe6', accent: '#e2562a', belly: '#ffffff', stripe: '#d8431f' },
    angel: { body: '#dfe4ea', accent: '#2a3340', belly: '#f6f8fa', stripe: '#1c232d' },
    clown: { body: '#f27a1a', accent: '#b94f0a', belly: '#fbd3a6', stripe: '#ffffff' },
    tetra: { body: '#3db4e8', accent: '#1267a3', belly: '#e3f4fd', stripe: '#e8483f' },
    puffer: { body: '#d9b23a', accent: '#8f6d12', belly: '#fbf3cf', stripe: '#f1dc8e' },
};
const FISH_BASE = { shark: 92, koi: 68, angel: 58, clown: 48, tetra: 36, puffer: 44 };

function buildFishFromData(data) {
    if (!data || !data.accounts) return;
    const rect = fishCanvas.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    const rate = data.rateInfo?.USD_CNY || data.exchangeRate?.USD_CNY || 6.88;
    const items = [];
    data.accounts.forEach(acc => {
        const cur = acc.currency || 'CNY';
        const mul = cur === 'USD' ? rate : cur === 'HKD' ? rate / 7.8 : 1;
        acc.holdings.forEach(h => {
            const mv = (h.marketValue || 0) * mul;
            if (mv <= 0) return;
            const nm = w1ShortName(h.name || h.symbol);
            items.push({ name: nm.length > 9 && (h.market === 'nasdaq' || h.market === 'nyse') ? h.symbol : nm, symbol: h.symbol, mv, sh: `${w1ShTxt(Number(h.shares) || 0)} ${w1Unit(h)}` });
        });
    });
    if (items.length === 0) return;
    items.sort((a, b) => b.mv - a.mv);
    const maxMV = items[0].mv;
    const k = Math.max(0.6, Math.min(1.6, Math.min(W / 960, H / 540)));   // 鱼的大小跟着画布走
    const oldMap = {};
    fishList.forEach(f => { oldMap[f.symbol] = f; });
    fishList = items.map((item, idx) => {
        const type = assignFishType(idx, items.length);
        const size = FISH_BASE[type] * (0.75 + 0.25 * Math.sqrt(item.mv / maxMV)) * k;
        const old = oldMap[item.symbol];
        const speed = FISH_SPEED * (type === 'shark' ? 0.7 : type === 'puffer' ? 0.28 : 0.45 + Math.random() * 0.15);
        return {
            name: item.name, sh: item.sh, symbol: item.symbol, size, type, colors: FISH_NATURAL[type],
            z: old ? old.z : 0.82 + Math.random() * 0.18,   // 远近: 远的小一点、淡一点
            x: old ? old.x : 60 + Math.random() * (W - 120),
            y: old ? old.y : 50 + Math.random() * (H - 180),
            vx: old ? old.vx : (Math.random() > 0.5 ? 1 : -1) * speed,
            vy: old ? old.vy : (Math.random() - 0.5) * speed * 0.4,
            speed, tailPhase: old ? old.tailPhase : Math.random() * Math.PI * 2,
            wobble: old ? old.wobble : Math.random() * Math.PI * 2,
            turnTimer: old ? old.turnTimer : 50 + Math.random() * 200,
            mouthPhase: Math.random() * Math.PI * 2,
            puffPhase: Math.random() * Math.PI * 2,
        };
    });
    fishDataReady = true;
    if (typeof syncVisualAnimations === 'function') syncVisualAnimations();
}

function hex2rgb(hex) {
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function lighten(hex, amt) {
    const [r,g,b] = hex2rgb(hex);
    return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}
function darken(hex, amt) { return lighten(hex, -amt); }

// ---- Draw each fish type ----
function drawShark(ctx, f, t) {
    const s = f.size, c = f.colors, tw = Math.sin(f.tailPhase) * 0.25;
    // Body - sleek elongated shape
    ctx.fillStyle = c.body;
    ctx.beginPath();
    ctx.moveTo(s * 0.9, 0);
    ctx.quadraticCurveTo(s * 0.5, -s * 0.35, -s * 0.2, -s * 0.2);
    ctx.quadraticCurveTo(-s * 0.7, -s * 0.1, -s * 0.9, 0);
    ctx.quadraticCurveTo(-s * 0.7, s * 0.15, -s * 0.2, s * 0.25);
    ctx.quadraticCurveTo(s * 0.3, s * 0.35, s * 0.9, 0);
    ctx.fill();
    // Body gradient overlay
    const bg = ctx.createLinearGradient(0, -s*0.4, 0, s*0.4);
    bg.addColorStop(0, lighten(c.body, 30));
    bg.addColorStop(0.4, c.body);
    bg.addColorStop(1, c.belly);
    ctx.fillStyle = bg;
    ctx.globalAlpha = 0.6;
    ctx.fill();
    ctx.globalAlpha = 1;
    // Belly
    ctx.fillStyle = c.belly;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.ellipse(s*0.1, s*0.12, s*0.5, s*0.1, 0, 0, Math.PI);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Dorsal fin - tall and iconic
    ctx.fillStyle = c.accent;
    ctx.beginPath();
    ctx.moveTo(s*0.15, -s*0.33);
    ctx.quadraticCurveTo(s*0.05, -s*0.85, -s*0.15, -s*0.35);
    ctx.quadraticCurveTo(0, -s*0.3, s*0.15, -s*0.33);
    ctx.fill();
    // Pectoral fins
    ctx.fillStyle = c.accent;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(s*0.3, s*0.15);
    ctx.quadraticCurveTo(s*0.2, s*0.5, 0, s*0.45);
    ctx.quadraticCurveTo(s*0.15, s*0.2, s*0.3, s*0.15);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Tail
    ctx.fillStyle = c.accent;
    ctx.beginPath();
    ctx.moveTo(-s*0.8, 0);
    ctx.quadraticCurveTo(-s*1.0, -s*0.3+tw*s, -s*1.2, -s*0.4+tw*s*1.2);
    ctx.quadraticCurveTo(-s*1.0, -s*0.1+tw*s*0.5, -s*0.95, 0);
    ctx.quadraticCurveTo(-s*1.0, s*0.1+tw*s*0.5, -s*1.2, s*0.35+tw*s*1.2);
    ctx.quadraticCurveTo(-s*1.0, s*0.25+tw*s, -s*0.8, 0);
    ctx.fill();
    // Gills
    ctx.strokeStyle = darken(c.body, 30);
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.4;
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(s*0.35 + i*4, 0, s*0.18, -0.8, 0.8);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s*0.55, -s*0.1, s*0.09, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(s*0.57, -s*0.1, s*0.05, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s*0.59, -s*0.12, s*0.02, 0, Math.PI*2); ctx.fill();
    // Teeth hint
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(s*0.82, s*0.01);
    ctx.lineTo(s*0.78, s*0.05);
    ctx.lineTo(s*0.85, s*0.01);
    ctx.stroke();
    ctx.globalAlpha = 1;
}

function drawKoi(ctx, f, t) {
    const s = f.size, c = f.colors, tw = Math.sin(f.tailPhase) * 0.3;
    // Flowing tail
    ctx.fillStyle = c.accent;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.moveTo(-s*0.6, 0);
    ctx.bezierCurveTo(-s*0.8, -s*0.4+tw*s, -s*1.1, -s*0.3+tw*s*1.3, -s*1.3, -s*0.5+tw*s*1.5);
    ctx.quadraticCurveTo(-s*1.0, tw*s*0.5, -s*1.3, s*0.5+tw*s*1.5);
    ctx.bezierCurveTo(-s*1.1, s*0.3+tw*s*1.3, -s*0.8, s*0.4+tw*s, -s*0.6, 0);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Body - plump oval
    const bg = ctx.createRadialGradient(s*0.1, -s*0.1, s*0.05, 0, 0, s*0.7);
    bg.addColorStop(0, lighten(c.body, 50));
    bg.addColorStop(0.5, c.body);
    bg.addColorStop(1, c.accent);
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(0, 0, s*0.7, s*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    // Koi pattern spots
    ctx.fillStyle = c.stripe;
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(s*0.15, -s*0.05, s*0.2, s*0.15, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-s*0.2, s*0.08, s*0.15, s*0.12, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    // Scales shimmer
    ctx.strokeStyle = lighten(c.body, 20);
    ctx.lineWidth = 0.5;
    ctx.globalAlpha = 0.3;
    for (let i = -2; i < 3; i++) {
        for (let j = -1; j < 2; j++) {
            ctx.beginPath();
            ctx.arc(i*s*0.18, j*s*0.14, s*0.08, 0.5, Math.PI-0.5);
            ctx.stroke();
        }
    }
    ctx.globalAlpha = 1;
    // Dorsal fin
    ctx.fillStyle = c.accent;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(s*0.2, -s*0.38);
    ctx.quadraticCurveTo(0, -s*0.65, -s*0.25, -s*0.38);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Flowing pectoral fin
    ctx.fillStyle = c.accent;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(s*0.2, s*0.2);
    ctx.quadraticCurveTo(s*0.1, s*0.55 + Math.sin(t*0.003+f.wobble)*5, -s*0.15, s*0.45 + Math.sin(t*0.003+f.wobble)*5);
    ctx.quadraticCurveTo(s*0.05, s*0.25, s*0.2, s*0.2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s*0.4, -s*0.08, s*0.1, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.arc(s*0.43, -s*0.08, s*0.055, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s*0.45, -s*0.1, s*0.02, 0, Math.PI*2); ctx.fill();
    // Whiskers (koi barbels)
    ctx.strokeStyle = c.accent;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(s*0.6, s*0.05); ctx.quadraticCurveTo(s*0.75, s*0.15, s*0.7, s*0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.6, s*0.08); ctx.quadraticCurveTo(s*0.72, s*0.2, s*0.65, s*0.28); ctx.stroke();
    ctx.globalAlpha = 1;
}

function drawAngel(ctx, f, t) {
    const s = f.size, c = f.colors, tw = Math.sin(f.tailPhase) * 0.2;
    // Tall body (diamond-ish)
    const bg = ctx.createLinearGradient(0, -s*0.6, 0, s*0.6);
    bg.addColorStop(0, lighten(c.body, 30));
    bg.addColorStop(0.5, c.body);
    bg.addColorStop(1, c.accent);
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(s*0.5, 0);
    ctx.quadraticCurveTo(s*0.3, -s*0.35, 0, -s*0.6);
    ctx.quadraticCurveTo(-s*0.15, -s*0.55, -s*0.4, -s*0.15);
    ctx.lineTo(-s*0.5, 0);
    ctx.lineTo(-s*0.4, s*0.15);
    ctx.quadraticCurveTo(-s*0.15, s*0.55, 0, s*0.6);
    ctx.quadraticCurveTo(s*0.3, s*0.35, s*0.5, 0);
    ctx.fill();
    // Vertical stripes
    ctx.strokeStyle = c.stripe;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.4;
    for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i*s*0.15, -s*0.4 + Math.abs(i)*s*0.15);
        ctx.lineTo(i*s*0.15, s*0.4 - Math.abs(i)*s*0.15);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // Long trailing dorsal
    ctx.fillStyle = c.accent;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(-s*0.1, -s*0.55);
    ctx.quadraticCurveTo(-s*0.5, -s*0.7 + Math.sin(t*0.002+f.wobble)*4, -s*0.7, -s*0.5 + Math.sin(t*0.002+f.wobble)*6);
    ctx.quadraticCurveTo(-s*0.4, -s*0.35, -s*0.35, -s*0.2);
    ctx.fill();
    // Long trailing ventral
    ctx.beginPath();
    ctx.moveTo(-s*0.1, s*0.55);
    ctx.quadraticCurveTo(-s*0.5, s*0.7 + Math.sin(t*0.002+f.wobble)*4, -s*0.7, s*0.5 + Math.sin(t*0.002+f.wobble)*6);
    ctx.quadraticCurveTo(-s*0.4, s*0.35, -s*0.35, s*0.2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Tail
    ctx.fillStyle = c.accent;
    ctx.beginPath();
    ctx.moveTo(-s*0.45, 0);
    ctx.quadraticCurveTo(-s*0.6, -s*0.2+tw*s, -s*0.75, -s*0.25+tw*s);
    ctx.quadraticCurveTo(-s*0.55, tw*s*0.3, -s*0.75, s*0.25+tw*s);
    ctx.quadraticCurveTo(-s*0.6, s*0.2+tw*s, -s*0.45, 0);
    ctx.fill();
    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s*0.25, -s*0.05, s*0.09, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.arc(s*0.27, -s*0.05, s*0.055, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(s*0.28, -s*0.05, s*0.03, 0, Math.PI*2); ctx.fill();
}

function drawClown(ctx, f, t) {
    const s = f.size, c = f.colors, tw = Math.sin(f.tailPhase) * 0.3;
    // Rounded body
    const bg = ctx.createRadialGradient(s*0.05, -s*0.05, s*0.05, 0, 0, s*0.55);
    bg.addColorStop(0, lighten(c.body, 40));
    bg.addColorStop(0.7, c.body);
    bg.addColorStop(1, c.accent);
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(0, 0, s*0.55, s*0.38, 0, 0, Math.PI*2);
    ctx.fill();
    // White stripes (clownfish signature)
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = s * 0.08;
    ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(s*0.2, -s*0.36); ctx.quadraticCurveTo(s*0.25, 0, s*0.2, s*0.36); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.15, -s*0.34); ctx.quadraticCurveTo(-s*0.12, 0, -s*0.15, s*0.34); ctx.stroke();
    ctx.globalAlpha = 1;
    // Black edge on white stripes
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.moveTo(s*0.16, -s*0.35); ctx.quadraticCurveTo(s*0.21, 0, s*0.16, s*0.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.24, -s*0.35); ctx.quadraticCurveTo(s*0.29, 0, s*0.24, s*0.35); ctx.stroke();
    ctx.globalAlpha = 1;
    // Dorsal fin
    ctx.fillStyle = c.body;
    ctx.beginPath();
    ctx.moveTo(s*0.15, -s*0.36);
    ctx.quadraticCurveTo(0, -s*0.58, -s*0.2, -s*0.36);
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5;

    ctx.beginPath(); ctx.arc(s*0.33, -s*0.06, s*0.055, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s*0.35, -s*0.08, s*0.02, 0, Math.PI*2); ctx.fill();
}

function drawTetra(ctx, f, t) {

function drawPuffer(ctx, f, t) {
    const s = f.size, c = f.colors;
    const puff = 1 + Math.sin(f.puffPhase) * 0.1;
    // Round puffy body
    const bg = ctx.createRadialGradient(s*0.05, -s*0.05, s*0.05, 0, 0, s*0.5*puff);

    bg.addColorStop(1, c.accent);

    ctx.beginPath(); ctx.arc(s*0.25, -s*0.11, s*0.07, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s*0.27, -s*0.13, s*0.025, 0, Math.PI*2); ctx.fill();
    // Mouth - cute pout

    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(s*0.4, s*0.05, s*0.05, 0.3, Math.PI - 0.3);
